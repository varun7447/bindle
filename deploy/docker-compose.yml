# Local Bindle stack: PostgreSQL + migrations + ingest + query API.
#   ./deploy/dev-env.sh                      # creates/updates deploy/.env with random local credentials
#   docker compose -f deploy/docker-compose.yml up --build
# Then point any agent at http://localhost:4318 with BINDLE_API_KEY from deploy/.env.
#
# Ports are published on 127.0.0.1 only. To reach the stack from another
# machine, use an SSH tunnel (ssh -L 4318:localhost:4318 host) rather than
# widening the publish.
x-db: &db-required
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/dev-env.sh to create deploy/.env}

services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      <<: *db-required
      POSTGRES_USER: bindle_owner
      POSTGRES_DB: bindle
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bindle_owner", "-d", "bindle"]
      interval: 2s
      retries: 30

  # Creates the app roles and schema, then exits.
  migrate:
    build: ../services
    entrypoint: ["/bindle-migrate"]
    restart: "no"
    environment:
      BINDLE_DB_ADMIN_URL: postgres://bindle_owner:${POSTGRES_PASSWORD:?run deploy/dev-env.sh}@postgres:5432/bindle?sslmode=disable
      BINDLE_DB_WRITER_PASSWORD: ${BINDLE_DB_WRITER_PASSWORD:?run deploy/dev-env.sh}
      BINDLE_DB_READER_PASSWORD: ${BINDLE_DB_READER_PASSWORD:?run deploy/dev-env.sh}
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build: ../services
    ports:
      - "127.0.0.1:4318:4318"
    environment:
      BINDLE_API_KEYS: ${BINDLE_API_KEYS:?run deploy/dev-env.sh to create deploy/.env}
      BINDLE_SINK: postgres
      BINDLE_DB_URL: postgres://bindle_writer:${BINDLE_DB_WRITER_PASSWORD:?run deploy/dev-env.sh}@postgres:5432/bindle?sslmode=disable
      BINDLE_PRICING_FILE: /etc/bindle/pricing.json
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ../services
    entrypoint: ["/bindle-api"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BINDLE_API_LISTEN: ":8080"
      BINDLE_DB_URL: postgres://bindle_reader:${BINDLE_DB_READER_PASSWORD:?run deploy/dev-env.sh}@postgres:5432/bindle?sslmode=disable
      # Until real console auth exists (step 3) the API rejects every request.
      # deploy/.env opts into the local-only bypass; it is accepted on the
      # container's wildcard bind only because the port above is published
      # to 127.0.0.1.
      BINDLE_API_DEV_AUTH_BYPASS_TENANT: ${BINDLE_API_DEV_AUTH_BYPASS_TENANT:-}
      BINDLE_API_DEV_AUTH_BYPASS_IN_CONTAINER: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pg-data:
