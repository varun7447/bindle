name: bindle
# Local Bindle stack: OpenSearch (traces) + PostgreSQL (control plane) + setup + ingest + query API + alerts.
#   ./deploy/local/dev-env.sh                      # creates/updates deploy/local/.env with random local credentials
#   docker compose -f deploy/local/compose.yaml up --build
# Then point any agent at http://localhost:4318 with BINDLE_API_KEY from deploy/local/.env.
#
# Ports are published on 127.0.0.1 only. To reach the stack from another
# machine, use an SSH tunnel (ssh -L 4318:localhost:4318 host) rather than
# widening the publish.
x-search: &search
  BINDLE_SEARCH_URL: http://opensearch:9200
  # Local only: the compose network carries basic-auth credentials over
  # plain HTTP. On AWS the domain is HTTPS-only.
  BINDLE_SEARCH_ALLOW_HTTP: "1"

services:
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?run deploy/local/dev-env.sh to create deploy/local/.env}
      # The security plugin stays on (authentication required); only TLS on
      # the HTTP layer is off for this local, loopback-published node.
      plugins.security.ssl.http.enabled: "false"
      # Java heap (default 1g; real agents with long prompts need more than
      # demo data). Heap dumps after an OutOfMemoryError go to /tmp, not the
      # data volume, so a crash can't fill the disk and block the restart.
      # Docker needs about 2.5x the heap in memory for this container.
      OPENSEARCH_JAVA_OPTS: -Xms${BINDLE_OPENSEARCH_HEAP:-1g} -Xmx${BINDLE_OPENSEARCH_HEAP:-1g} -XX:HeapDumpPath=/tmp
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      retries: 40

  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: bindle_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/local/dev-env.sh to create deploy/local/.env}
      POSTGRES_DB: bindle
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bindle_owner", "-d", "bindle"]
      interval: 2s
      retries: 30

  # OpenSearch: retention policy, index template, rollup index, and the
  # bindle_writer / bindle_reader users. PostgreSQL: control-plane roles and
  # schema, plus the local dev tenant with BINDLE_API_KEY. Then exits.
  setup:
    build:
      context: ../../backend
      args:
        # Go module downloads: "direct" fetches from source repositories (works
        # where proxy.golang.org is blocked); set BINDLE_GOPROXY to change it.
        GOPROXY: ${BINDLE_GOPROXY:-direct}
    entrypoint: ["/bindle-migrate"]
    restart: "no"
    environment:
      <<: *search
      BINDLE_SEARCH_ADMIN_USER: admin
      BINDLE_SEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?run deploy/local/dev-env.sh}
      BINDLE_SEARCH_WRITER_PASSWORD: ${BINDLE_SEARCH_WRITER_PASSWORD:?run deploy/local/dev-env.sh}
      BINDLE_SEARCH_READER_PASSWORD: ${BINDLE_SEARCH_READER_PASSWORD:?run deploy/local/dev-env.sh}
      BINDLE_SEARCH_REPLICAS: "0"
      BINDLE_CONTROL_DB_ADMIN_URL: postgres://bindle_owner:${POSTGRES_PASSWORD:?run deploy/local/dev-env.sh}@postgres:5432/bindle?sslmode=disable
      BINDLE_CONTROL_API_PASSWORD: ${BINDLE_CONTROL_API_PASSWORD:?run deploy/local/dev-env.sh}
      BINDLE_CONTROL_INGEST_PASSWORD: ${BINDLE_CONTROL_INGEST_PASSWORD:?run deploy/local/dev-env.sh}
      BINDLE_CONTROL_ALERTS_PASSWORD: ${BINDLE_CONTROL_ALERTS_PASSWORD:?run deploy/local/dev-env.sh}
      BINDLE_DEV_SEED_TENANT: dev-tenant
      BINDLE_DEV_SEED_KEY: ${BINDLE_API_KEY:?run deploy/local/dev-env.sh}
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ingest:
    build:
      context: ../../backend
      args:
        # Go module downloads: "direct" fetches from source repositories (works
        # where proxy.golang.org is blocked); set BINDLE_GOPROXY to change it.
        GOPROXY: ${BINDLE_GOPROXY:-direct}
    ports:
      - "127.0.0.1:4318:4318"
    environment:
      <<: *search
      # Ingest keys are resolved in the control plane.
      BINDLE_CONTROL_DB_URL: postgres://bindle_ingest:${BINDLE_CONTROL_INGEST_PASSWORD:?run deploy/local/dev-env.sh}@postgres:5432/bindle?sslmode=disable
      BINDLE_SINK: opensearch
      BINDLE_SEARCH_USER: bindle_writer
      BINDLE_SEARCH_PASSWORD: ${BINDLE_SEARCH_WRITER_PASSWORD:?run deploy/local/dev-env.sh}
      BINDLE_PRICING_FILE: /etc/bindle/pricing.json
      # Fields over 32 KiB go to the payload store (S3 on AWS).
      BINDLE_PAYLOAD_STORE: file:///data/payloads
    volumes:
      - payloads:/data/payloads
    depends_on:
      setup:
        condition: service_completed_successfully

  api:
    build:
      context: ../../backend
      args:
        # Go module downloads: "direct" fetches from source repositories (works
        # where proxy.golang.org is blocked); set BINDLE_GOPROXY to change it.
        GOPROXY: ${BINDLE_GOPROXY:-direct}
    entrypoint: ["/bindle-api"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *search
      BINDLE_API_LISTEN: ":8080"
      BINDLE_PRICING_FILE: /etc/bindle/pricing.json
      BINDLE_SEARCH_USER: bindle_reader
      BINDLE_SEARCH_PASSWORD: ${BINDLE_SEARCH_READER_PASSWORD:?run deploy/local/dev-env.sh}
      BINDLE_PAYLOAD_STORE: file:///data/payloads
      BINDLE_CONTROL_DB_URL: postgres://bindle_api:${BINDLE_CONTROL_API_PASSWORD:?run deploy/local/dev-env.sh}@postgres:5432/bindle?sslmode=disable
      # Console sign-in uses Amazon Cognito when BINDLE_COGNITO_ISSUER and
      # BINDLE_COGNITO_CLIENT_ID are set (see deploy/aws). Without them the API
      # rejects every request, unless deploy/local/.env opts into the local-only
      # bypass; that is accepted on the container's wildcard bind only because
      # the port above is published to 127.0.0.1.
      BINDLE_COGNITO_ISSUER: ${BINDLE_COGNITO_ISSUER:-}
      BINDLE_COGNITO_CLIENT_ID: ${BINDLE_COGNITO_CLIENT_ID:-}
      BINDLE_API_DEV_AUTH_BYPASS_TENANT: ${BINDLE_API_DEV_AUTH_BYPASS_TENANT:-}
      # Optional: an email for the dev-bypass user, to try owner-only actions locally.
      BINDLE_API_DEV_AUTH_BYPASS_EMAIL: ${BINDLE_API_DEV_AUTH_BYPASS_EMAIL:-}
      BINDLE_API_DEV_AUTH_BYPASS_IN_CONTAINER: "1"
      BINDLE_CONSOLE_URL: http://localhost:3000
    volumes:
      - payloads:/data/payloads:ro
    depends_on:
      setup:
        condition: service_completed_successfully

  # Evaluates alert rules every minute and sends Slack/webhook alerts
  # (email needs Amazon SES, so it is off locally). Publishes no port.
  alerts:
    build:
      context: ../../backend
      args:
        # Go module downloads: "direct" fetches from source repositories (works
        # where proxy.golang.org is blocked); set BINDLE_GOPROXY to change it.
        GOPROXY: ${BINDLE_GOPROXY:-direct}
    entrypoint: ["/bindle-alerts"]
    environment:
      <<: *search
      BINDLE_SEARCH_USER: bindle_reader
      BINDLE_SEARCH_PASSWORD: ${BINDLE_SEARCH_READER_PASSWORD:?run deploy/local/dev-env.sh}
      BINDLE_CONTROL_DB_URL: postgres://bindle_alerts:${BINDLE_CONTROL_ALERTS_PASSWORD:?run deploy/local/dev-env.sh}@postgres:5432/bindle?sslmode=disable
      BINDLE_CONSOLE_URL: http://localhost:3000
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  os-data:
  pg-data:
  payloads:
